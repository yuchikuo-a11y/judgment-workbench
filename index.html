<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>判決分析工作台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: 左側為程序卷宗式步驟欄（手機改為頂部橫向），右側為單一工作區，一次處理一個步驟 */
:root{
  --bg:#f3f5f7; --paper:#ffffff; --ink:#18232f; --muted:#5d6b78; --line:#d9dfe5; --soft:#e9edf1;
  --accent:#1d5e57; --accent-ink:#ffffff; --accent-soft:#dcebe8;
  --seal:#a8322b; --warn:#8a5a00; --warn-soft:#fbf0d9; --ok:#2e6b3a; --ok-soft:#e0efe2;
  --code:#eef1f4;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171d; --paper:#18212a; --ink:#e4e9ee; --muted:#93a1ae; --line:#2b3743; --soft:#212c37;
  --accent:#5fb3a7; --accent-ink:#0c1a18; --accent-soft:#1d3532;
  --seal:#e0675f; --warn:#e2b45a; --warn-soft:#3a2f17; --ok:#7cc28a; --ok-soft:#1d3323; --code:#0f151b;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171d; --paper:#18212a; --ink:#e4e9ee; --muted:#93a1ae; --line:#2b3743; --soft:#212c37;
  --accent:#5fb3a7; --accent-ink:#0c1a18; --accent-soft:#1d3532;
  --seal:#e0675f; --warn:#e2b45a; --warn-soft:#3a2f17; --ok:#7cc28a; --ok-soft:#1d3323; --code:#0f151b;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:22px 14px;flex-wrap:wrap}
.seal{width:44px;height:44px;border:2px solid var(--seal);color:var(--seal);border-radius:6px;display:grid;place-items:center;
  font-family:var(--f-display);font-weight:900;font-size:24px;transform:rotate(-4deg);flex:none}
.top h1{font-family:var(--f-display);font-weight:900;font-size:1.55rem;margin:0;letter-spacing:.04em;text-wrap:balance}
.top p{margin:0;color:var(--muted);font-size:.88rem}
.top .spacer{flex:1}
.conn{font-size:.8rem;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.conn.ok{background:var(--ok-soft);color:var(--ok)}
.conn.bad{background:var(--warn-soft);color:var(--warn)}

.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;padding-bottom:48px}
nav.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);align-self:start;display:flex;flex-direction:column;gap:2px}
.step{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;text-align:left;background:none;border:0;
  padding:10px 10px;border-radius:var(--r);cursor:pointer;color:var(--ink)}
.step:hover{background:var(--soft)}
.step[aria-current="step"]{background:var(--paper);box-shadow:0 0 0 1px var(--line)}
.step .dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;
  font-family:var(--f-display);font-weight:700;font-size:.9rem;color:var(--muted);background:var(--bg)}
.step .t{font-weight:500;line-height:1.35}
.step .s{display:block;font-size:.76rem;color:var(--muted);margin-top:2px}
.step[data-st="done"] .dot{border-color:var(--accent);color:var(--accent)}
.step[data-st="confirmed"] .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step[data-st="running"] .dot{border-color:var(--accent);border-style:dashed;animation:spin 2.4s linear infinite}
.step[data-st="skipped"] .t{color:var(--muted);text-decoration:line-through}
.step[data-st="locked"]{opacity:.55}
@keyframes spin{to{transform:rotate(360deg)}}
.navfoot{margin-top:14px;padding:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.navfoot label{font-size:.78rem;color:var(--muted)}

main{min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:24px clamp(16px,3vw,32px)}
.eyebrow{font-size:.75rem;letter-spacing:.14em;color:var(--accent);font-weight:700}
.card h2{font-family:var(--f-display);font-size:1.45rem;margin:4px 0 6px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 18px;max-width:62ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--paper);padding:8px 16px;border-radius:var(--r);cursor:pointer;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg label{padding:7px 14px;cursor:pointer;font-size:.9rem;border-right:1px solid var(--line)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent-soft);color:var(--accent);font-weight:700}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
textarea,input[type=text],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
textarea{resize:vertical;line-height:1.75}
#src{min-height:340px;font-size:.92rem}
.meta{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.88rem}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:.85rem;font-weight:500}
.stack{display:flex;flex-direction:column;gap:16px}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.check{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer}
.check:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.check b{display:block;font-weight:700}
.check small{color:var(--muted)}
.check input{margin-top:5px;accent-color:var(--accent)}

.notice{border-radius:var(--r);padding:10px 14px;font-size:.88rem;background:var(--warn-soft);color:var(--warn)}
.notice.info{background:var(--soft);color:var(--muted)}
.pause{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:22px;padding-top:18px}
.pause .q{flex:1 1 220px;font-family:var(--f-display);font-weight:700}

.out{margin-top:20px;border-top:1px solid var(--line);padding-top:6px;min-height:40px}
.out.empty{color:var(--muted);font-size:.9rem;padding-top:18px}
.thinking{display:flex;gap:10px;align-items:center;color:var(--muted);padding:18px 0}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.thinking i,.step[data-st="running"] .dot{animation:none}}

/* rendered markdown */
.md{max-width:78ch}
.md h1,.md h2,.md h3,.md h4{font-family:var(--f-display);line-height:1.35;text-wrap:balance}
.md h1{font-size:1.35rem;margin:1.2em 0 .5em}
.md h2{font-size:1.2rem;margin:1.4em 0 .5em;padding-bottom:.3em;border-bottom:1px solid var(--line)}
.md h3{font-size:1.05rem;margin:1.2em 0 .4em;color:var(--accent)}
.md h4{font-size:1rem;margin:1em 0 .3em}
.md p,.md ul,.md ol{margin:.5em 0}
.md li{margin:.2em 0}
.md blockquote{margin:.8em 0;padding:.4em 1em;border-left:3px solid var(--accent);background:var(--soft);color:var(--ink)}
.md code{font-family:var(--f-mono);font-size:.86em;background:var(--code);padding:.1em .35em;border-radius:4px}
.md pre{background:var(--code);padding:14px;border-radius:var(--r);overflow-x:auto;font-size:.86rem;line-height:1.6}
.md pre code{background:none;padding:0;white-space:pre}
.md .tbl{overflow-x:auto;margin:.8em 0;max-width:100%}
.md table{border-collapse:collapse;min-width:100%;font-size:.88rem}
.md th,.md td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.md th{background:var(--soft);font-weight:700;white-space:nowrap}
.md hr{border:0;border-top:1px solid var(--line);margin:1.4em 0}
.mmd{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:.8em 0;overflow-x:auto;background:var(--bg)}
.mmd svg{max-width:none;height:auto}
.mmd .err{color:var(--warn);font-size:.82rem;margin-bottom:6px}

.revise{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.revise textarea{min-height:70px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 18px;border-radius:99px;font-size:.88rem;z-index:20;transition:opacity .2s}
.toast[hidden]{display:none}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.steps{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .step{grid-template-columns:28px auto;min-width:max-content;padding:8px}
  .step .dot{width:26px;height:26px;font-size:.8rem}
  .step .s{display:none}
  .navfoot{display:none}
  .mobilefoot{display:flex!important}
}
.mobilefoot{display:none;gap:8px;flex-wrap:wrap;margin-top:14px}
</style>
</head>
<body>
<header class="top">
  <div class="seal" aria-hidden="true">判</div>
  <div>
    <h1>判決分析工作台</h1>
    <p>貼上判決全文，逐步完成摘要、爭點、圖表、訴訟策略與上訴書狀草稿</p>
  </div>
  <div class="spacer"></div>
  <span class="conn" id="conn">正在連線 Claude…</span>
</header>

<div class="shell">
  <nav class="steps" id="steps" aria-label="分析步驟"></nav>
  <main>
    <section class="card" id="stage"></section>
    <div class="mobilefoot" id="mobilefoot"></div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.6.1/mermaid.min.js"></script>
<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const MAX_CHARS = 180000;

/* ---------- 步驟定義 ---------- */
const STAGES = [
  { id: "input",    no: "卷", title: "判決全文",       sub: "貼上或上傳判決／評析文章" },
  { id: "basic",    no: "一", title: "類型判斷與基本分析", sub: "第一、二步：六點分析" },
  { id: "charts",   no: "二", title: "流程圖與人物關係圖", sub: "第三步：圖表視覺化" },
  { id: "extra",    no: "三", title: "選擇性圖表",       sub: "第四步：時間軸／資金／邏輯" },
  { id: "strategy", no: "四", title: "訴訟策略",         sub: "第五步：雙方建議" },
  { id: "review",   no: "五", title: "學者評析檢視",     sub: "第六步：可略過" },
  { id: "appeal",   no: "六", title: "上訴書狀",         sub: "第七步：草稿" },
];

/* ---------- 狀態（只存於本機瀏覽器） ---------- */
const blank = () => ({
  mode: "judgment", text: "", active: "input", tier: "default",
  status: {}, out: {},
  opt: { extra: [], article: "", kind: "刑事", party: "被告", notes: "" },
});
let S = blank();
try { const saved = JSON.parse(localStorage.getItem("jwb-state") || "null"); if (saved && typeof saved === "object") S = Object.assign(blank(), saved, { opt: Object.assign(blank().opt, saved.opt || {}) }); } catch (e) {}
let saveTimer;
function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem("jwb-state", JSON.stringify(S)); } catch (e) {} }, 300);
}
Object.keys(S.status).forEach(k => { if (S.status[k] === "running") S.status[k] = S.out[k] ? "done" : "ready"; });

/* ---------- Claude 連線 ---------- */
let sample = null, sampleState = "pending", ctl = null, runningId = null;
const conn = $("#conn");
(async () => {
  try { sample = window.claude && window.claude.use ? await window.claude.use("sample") : null; } catch (e) { sample = null; }
  sampleState = sample ? "ok" : "none";
  conn.textContent = sample ? "Claude 已連線" : "無法連線 Claude";
  conn.className = "conn " + (sample ? "ok" : "bad");
  render();
})();
let downloads = null;
(async () => { try { downloads = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) {} render(); })();

/* ---------- 提示詞 ---------- */
const RULES = `【輸出格式規範】
- 以 Markdown 標題層級（##、###）區分各節；條列式為主，每點完整表達
- 表格使用 Markdown 表格
- 引用法條格式：刑法第185條之3第1項第1款
- 引用判例格式：最高法院110年度台上字第1234號判決
- 全形標點符號、繁體中文
- 只依提供之文件內容分析；文件未記載者註明「判決未載明」，不得杜撰事實、頁碼或字號
- 自行補充之最高法院判決字號，須標明「（建議補充，請自行查核）」
- 直接輸出內容，不要寫開場白，也不要在結尾詢問使用者`;

const MERMAID_RULES = `【圖表語法（務必遵守，否則無法顯示）】
- 每張圖放在獨立的 \`\`\`mermaid 程式碼區塊中
- 只使用 flowchart TD 或 flowchart LR
- 節點一律寫成 n1["文字"]，id 僅用英文字母與數字；文字內不得含雙引號、不得含 HTML
- 連線標籤寫成 n1 -->|"文字"| n2；雙向關係用兩條連線
- 可使用 subgraph g1["分組名稱"] … end 分組；不要使用 classDef、style、click
- 每張圖前以 ### 標題標示，圖後以一至三句文字說明重點`;

const TYPE_TABLE = `| 類型 | 特徵 | 對分析之影響 |
|---|---|---|
| A．事實審判決 | 一、二審，有具體犯罪事實、兩造攻防 | 完整執行六點 |
| B．法律審／統一見解裁判 | 最高法院就法律爭議表示見解（如徵詢程序、歧異見解統一） | 爭點表改為「法律見解對照表」（肯定說／否定說／本庭見解）；犯罪事實、量刑理由如未實體審理，標註「不適用」並說明原因 |
| C．程序性／不受理裁判 | 因被告死亡、判決確定等程序原因未為實體判決 | 同類型B，並於判決結果分析註明何部分為程序處理、何部分仍為實體裁判 |`;

function doc() {
  let t = S.text;
  if (t.length > MAX_CHARS) t = t.slice(0, MAX_CHARS) + "\n\n（以下因長度限制截斷）";
  return `${S.mode === "article" ? "【評析文章全文（未提供判決原文）】" : "【判決書全文】"}\n<<<\n${t}\n>>>`;
}
function prior(ids) {
  return ids.filter(id => S.out[id]).map(id => `【已經使用者確認之「${STAGES.find(s => s.id === id).title}」】\n<<<\n${S.out[id]}\n>>>`).join("\n\n");
}

const PROMPTS = {
  basic: () => `你是協助台灣法律實務工作者的判決分析助理。請分析下列判決，依序完成「第一步」與「第二步」。

## 第一步：判決類型判斷
依下表判斷本判決屬於何種類型，以「## 判決類型判斷」開頭，說明判斷結果與理由，作為後續分析之前提：
${TYPE_TABLE}

## 第二步：判決基本分析（依序完成六點，各點以 ## 標題）
一、判決基本資訊：案號、法院、庭別；當事人（刑事：被告／檢察官；民事：原告／被告）；判決日期、主文內容；判決架構（章節段落概述）；本判決性質（類型A／B／C）。
二、爭點與主張對照表：類型A以表格「| 爭點 | 原告／檢察官主張 | 被告主張 | 法院見解 |」；類型B／C改為「| 爭點 | 肯定說 | 否定說 | 本庭見解 |」。
三、犯罪事實與證據分析：法院認定的犯罪事實；涉案法律條文；支持認定事實的證據資料（逐一列出）。民事案件改為「事實與證據分析」。類型B／C如未實體審理，標註「不適用（本判決未就犯罪事實為實體審理，原因：…）」。
四、法律條文解釋與適用：列出本案所有被討論的法律條文，每一條依下列格式：
【條文】刑法第○條第○項
【法院解釋】…
【本案應用】…
五、判決結果分析：刑事列出有罪、無罪的罪名與理由；民事列出勝訴、敗訴的部分與理由；類型C分別說明程序處理部分與實體裁判部分。
六、量刑理由分析（僅刑事類型A）：從重考量因素、從輕考量因素、最終量刑結果說明；不適用者標註「不適用」並說明原因。

${RULES}

${doc()}`,

  charts: () => `你是判決分析助理。請根據下列判決與已確認的基本分析，完成「第三步：圖表視覺化」，繪製兩張圖：

### 七、流程圖
- 類型A：繪製從犯罪（或紛爭）開始到被逮捕（或起訴、判決）的完整過程
- 類型B／C：改繪「訴訟程序流程圖」，呈現本案自起訴／上訴至本判決之程序演進

### 八、人物關係圖
標示各方當事人的角色與關係（被告、被害人、共犯、證人、檢察官、法院等），連線上註明關係。類型B／C如當事人單純，可簡化，並說明簡化原因。

${MERMAID_RULES}

${RULES}

${prior(["basic"])}

${doc()}`,

  extra: () => {
    const map = {

/* ---------- Markdown 與圖表渲染 ---------- */
if (window.marked) marked.setOptions({ gfm: true, breaks: false, mangle: false, headerIds: false });
function isDark() {
  const t = document.documentElement.getAttribute("data-theme");
  if (t) return t === "dark";
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
}
let mmdReady = false;
function initMermaid() {
  if (!window.mermaid) return;

    fontFamily: '"Noto Sans TC","Microsoft JhengHei",sans-serif', flowchart: { htmlLabels: false, useMaxWidth: false } });

}
let mmdSeq = 0;
function mdToNode(md, final) {
  const wrap = document.createElement("div");
  wrap.className = "md";
  if (!window.marked || !window.DOMPurify) { wrap.textContent = md; return wrap; }
  wrap.innerHTML = DOMPurify.sanitize(marked.parse(md));
  wrap.querySelectorAll("table").forEach(t => { const d = document.createElement("div"); d.className = "tbl"; t.replaceWith(d); d.appendChild(t); });
  wrap.querySelectorAll("pre > code.language-mermaid").forEach(code => {
    const src = code.textContent;
    const box = document.createElement("div");
    box.className = "mmd";
    code.parentElement.replaceWith(box);
    if (!final) { box.textContent = "圖表產生中…"; return; }
    if (!mmdReady) initMermaid();
    if (!window.mermaid) { const p = document.createElement("pre"); p.textContent = src; box.appendChild(p); return; }
    const id = "mmd" + (++mmdSeq);
    mermaid.render(id, src).then(({ svg }) => { box.innerHTML = svg; }).catch(err => {
      document.getElementById("d" + id)?.remove();
      box.innerHTML = "";
      const e = document.createElement("div"); e.className = "err"; e.textContent = "這張圖的語法無法顯示，下方是原始碼。可在修正意見寫「重畫這張圖」。";

}

async function run(id, feedback) {
  if (!sample || runningId) return;
  let prompt = PROMPTS[id]();
  if (feedback) {
    prompt += `\n\n【你先前的輸出】\n<<<\n${S.out[id]}\n>>>\n\n【使用者的修正意見】\n${feedback}\n\n請依修正意見輸出修正後的「完整」版本（不是只輸出差異）。`;
  }
  const prevOut = S.out[id], prevSt = S.status[id];
  runningId = id; S.status[id] = "running"; persist(); render();
  ctl = new AbortController();
  const box = $("#out");
  let pending = null;
  const paint = (txt, final) => { if (!box) return; box.className = "out"; box.replaceChildren(mdToNode(txt, final)); };
  try {
    const { text, truncated } = await sample(prompt, {
      signal: ctl.signal, cache: false, modelTier: S.tier,
      onText: ({ text }) => { S.out[id] = text; if (!pending) pending = requestAnimationFrame(() => { pending = null; if (S.active === id) paint(S.out[id], false); }); },
    });
    S.out[id] = text; S.status[id] = "done";
    if (truncated) toast("內容過長被截斷，可在修正意見要求精簡後重新產生");
  } catch (e) {
    if (e && e.code === "cancelled") {
      if (e.text) { S.out[id] = e.text; S.status[id] = "done"; } else { S.out[id] = prevOut; S.status[id] = prevOut ? (prevSt === "running" ? "done" : prevSt) : "ready"; }
      toast("已停止");
    } else {
      if (e && e.code === "refused") S.out[id] = prevOut; else if (e && e.text) S.out[id] = e.text; else S.out[id] = prevOut;
      S.status[id] = S.out[id] ? "done" : "ready";
      if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) { sample = null; sampleState = "none"; conn.textContent = "Claude 未授權"; conn.className = "conn bad"; }
      S.lastErr = errCopy(e);
    }
  } finally {
    if (pending) cancelAnimationFrame(pending);
    runningId = null; ctl = null; persist(); render();
    if (S.lastErr) { toast(S.lastErr); S.lastErr = null; }
  }
}

    file.addEventListener("change", () => handle(file.files[0]));
    drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); handle(e.dataTransfer.files[0]); });

    const mode = el("div", { class: "seg", role: "radiogroup", "aria-label": "文件種類" },
      ...[["judgment", "判決書原文"], ["article", "學者評析／裁判精選"]].map(([v, l]) => {
        const r = el("input", { type: "radio", name: "mode", id: "mode-" + v, value: v, checked: S.mode === v ? true : false,
          onchange: () => { S.mode = v; persist(); render(); } });
        return el("label", { for: "mode-" + v }, r, l);
      }));
    const canStart = () => ta.value.trim().length > 50 && !!sample && !runningId;
    const startBtn = el("button", { class: "btn primary", disabled: !canStart(), onclick: startAnalysis },
      S.mode === "article" ? "開始整理評析 →" : "開始分析判決 →");
    const hasWork = STAGES.slice(1).some(x => S.out[x.id]);
    return [
      ...header(s, S.mode === "article"
        ? "貼上他人整理之判決摘錄或評析文章。系統會直接進入「學者評析檢視」，判斷它是純摘錄還是有獨立評析意見。"
        : "貼上判決全文後按「開始分析判決」。每一步完成後會停下來讓你檢查、修正，確認後才進入下一步。"),
      el("div", { class: "stack" },
        noClaudeNotice(),
        el("div", { class: "row" }, mode),
        ta,
        el("div", { class: "row" }, meta, el("span", { style: "flex:1" }),
          ta.value ? el("button", { class: "btn ghost", onclick: () => { S.text = ""; persist(); render(); } }, "清空") : null),
        drop,
        hasWork ? el("div", { class: "notice info" }, "這份案件已有分析結果。重新開始會覆蓋「類型判斷與基本分析」並清除後續步驟。") : null,
        el("div", { class: "row" }, startBtn),
        el("p", { class: "meta" }, "內容只保存在你這台裝置的瀏覽器裡，送出分析時才會傳給 Claude。"),
      ),
    ];
  },

  basic() {
    const s = STAGES[1];
    return [...header(s, "判斷判決類型（事實審／法律審／程序性裁判），再完成基本資訊、爭點對照、事實與證據、法條適用、判決結果、量刑理由六點。"),
      noClaudeNotice(), runControls("basic", "產生基本分析"), outputBlock("basic"),
      reviseAndConfirm("basic", "第二步完成。請確認以上內容是否正確。")];
  },

  charts() {
    const s = STAGES[2];
    return [...header(s, "依判決類型繪製流程圖（事實審為犯罪經過；法律審或程序裁判為訴訟程序演進）與人物關係圖。"),
      noClaudeNotice(), runControls("charts", "繪製圖表"), outputBlock("charts"),
      reviseAndConfirm("charts", "第三步完成。請確認圖表內容。")];
  },

  extra() {
    const s = STAGES[3];
    const items = [["timeline", "本案判決時間軸", "事實、偵查、起訴與各審判決的日期"], ["money", "本案資金流向圖", "誰把錢交給誰、金額與方式"], ["logic", "本案判決思維邏輯圖", "爭點→規範→涵攝→結論"]];
    const checks = el("div", { class: "checks" }, ...items.map(([v, t, d]) => {
      const c = el("input", { type: "checkbox", id: "ex-" + v, checked: S.opt.extra.includes(v) ? true : false,
        onchange: e => { S.opt.extra = e.target.checked ? [...new Set([...S.opt.extra, v])] : S.opt.extra.filter(x => x !== v); persist(); render(); } });
      return el("label", { class: "check", for: "ex-" + v }, c, el("span", {}, el("b", {}, t), el("small", {}, d)));
    }));
    const state = st("extra");
    return [...header(s, "可複選需要的圖表；不需要可直接略過，進入訴訟策略。"),
      noClaudeNotice(), checks,
      el("div", { class: "row", style: "margin-top:14px" },
        runControls("extra", "繪製所選圖表", !S.opt.extra.length),
        state !== "confirmed" && state !== "running" ? el("button", { class: "btn ghost", onclick: () => skipStage("extra") }, "不需要，略過") : null),
      outputBlock("extra"),
      reviseAndConfirm("extra", "圖表完成，繼續擬定訴訟策略。", { confirmLabel: "繼續訴訟策略 →" })];
  },

  strategy() {
    const s = STAGES[4];
    return [...header(s, "分別為雙方當事人擬定攻防重點、補強證據方向與上訴風險評估。"),
      noClaudeNotice(), runControls("strategy", "擬定訴訟策略"), outputBlock("strategy"),
      reviseAndConfirm("strategy", "訴訟策略完成。接著可整理學者評析。", { confirmLabel: "繼續 →" })];
  },

  review() {
    const s = STAGES[5];
    const articleMode = S.mode === "article";
    const state = st("review");
    const ta = el("textarea", { id: "article", style: "min-height:200px", placeholder: "貼上相關學者評析文章（期刊、月旦、法學雜誌等）全文或摘錄…" });
    ta.value = S.opt.article;
    ta.addEventListener("input", () => { S.opt.article = ta.value; persist(); const b = $("#run-review"); if (b) b.disabled = !sample || !!runningId || !ta.value.trim(); });
    const ctlRow = runControls("review", "整理評析", !articleMode && !S.opt.article.trim());
    ctlRow.querySelector(".btn.primary")?.setAttribute("id", "run-review");
    return [...header(s, articleMode
        ? "判斷文章是純摘錄型還是評析型；評析型會整理作者立場、補充論點與值得註記之處。"
        : "是否有相關學者評析文章？如有，貼上全文或摘錄，我會判斷性質並整理重點。沒有可直接略過。"),
      noClaudeNotice(),
      articleMode ? null : ta,
      el("div", { class: "row", style: "margin-top:14px" }, ctlRow,
        !articleMode && state !== "confirmed" && state !== "running" ? el("button", { class: "btn ghost", onclick: () => skipStage("review") }, "沒有評析，略過") : null),
      outputBlock("review"),
      reviseAndConfirm("review", "是否需要撰寫上訴書狀？", { confirmLabel: "需要，撰寫上訴書狀 →" })];
  },

  appeal() {
    const s = STAGES[6];
    const kind = el("div", { class: "seg", role: "radiogroup", "aria-label": "書狀種類" },
      ...["刑事", "民事"].map(v => el("label", { for: "kind-" + v },
        el("input", { type: "radio", name: "kind", id: "kind-" + v, checked: S.opt.kind === v ? true : false, onchange: () => { S.opt.kind = v; if (v === "刑事" && !["被告", "檢察官"].includes(S.opt.party)) S.opt.party = "被告"; if (v === "民事" && !["原告", "被告"].includes(S.opt.party)) S.opt.party = "原告"; persist(); render(); } }), v + "上訴理由書")));
    const parties = S.opt.kind === "刑事" ? ["被告", "檢察官"] : ["原告", "被告"];
    const party = el("div", { class: "seg", role: "radiogroup", "aria-label": "上訴人" },
      ...parties.map(v => el("label", { for: "party-" + v },
        el("input", { type: "radio", name: "party", id: "party-" + v, checked: S.opt.party === v ? true : false, onchange: () => { S.opt.party = v; persist(); } }), v)));
    const notes = el("textarea", { id: "notes", style: "min-height:80px", placeholder: "選填。例如：主攻量刑過重；請加入證人甲證詞前後矛盾的論點" });
    notes.value = S.opt.notes;
    notes.addEventListener("input", () => { S.opt.notes = notes.value; persist(); });
    return [...header(s, "依判決內容指出具體違誤，引用段次，並套用標準書狀格式。完成後請自行查核引用的判決字號。"),
      noClaudeNotice(),
      el("div", { class: "stack" },
        el("div", { class: "field" }, el("span", {}, "書狀種類"), el("div", {}, kind)),
        el("div", { class: "field" }, el("span", {}, "上訴人立場"), el("div", {}, party)),
        el("label", { class: "field", for: "notes" }, el("span", {}, "補充指示"), notes),
        runControls("appeal", "草擬上訴理由書")),
      outputBlock("appeal"),
      S.out.appeal && st("appeal") !== "running" ? el("div", { class: "notice", style: "margin-top:16px" }, "以上為草稿，正式提出前請確認引用判例字號之正確性。") : null,
      reviseAndConfirm("appeal", "書狀草稿完成。可複製或下載完整報告。", { confirmLabel: "完成" })];
  },

  reset() {
    return [el("div", { class: "eyebrow" }, "開新案件"), el("h2", {}, "清除目前案件？"),
      el("p", { class: "lead" }, "會刪除這台裝置上的判決全文與所有分析結果。需要保留的話，先用「複製完整報告」或「下載報告」存起來。"),
      el("div", { class: "row" },
        el("button", { class: "btn primary", onclick: () => { if (ctl) ctl.abort(); S = blank(); persist(); render(); toast("已清除"); } }, "清除並開新案件"),
        el("button", { class: "btn", onclick: () => go(S.prev || "input") }, "取消"))];
  },
};

function startAnalysis() {
  if (S.mode === "article") {
    for (const id of ["basic", "charts", "extra", "strategy"]) S.status[id] = "skipped";
    S.status.review = "ready"; S.out.review = ""; S.out.appeal = ""; S.status.appeal = "locked";
    go("review"); run("review");
  } else {
    for (const s of STAGES.slice(2)) { S.status[s.id] = "locked"; delete S.out[s.id]; }
    S.status.basic = "ready";
    go("basic"); run("basic");
  }
}

/* ---------- PDF 讀取（需要時才載入 pdf.js） ---------- */
let pdfLoading;
function loadScript(src) { return new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.append(s); }); }
async function readPdf(f) {
  if (!window.pdfjsLib) {
    pdfLoading = pdfLoading || (async () => {
      await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js");
      await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    })();
    await pdfLoading;
  }
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await f.arrayBuffer()), isEvalSupported: false }).promise;
  const out = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const c = await (await pdf.getPage(i)).getTextContent();
    let line = "", lastY = null;
    const lines = [];
    for (const it of c.items) {
      const y = it.transform ? Math.round(it.transform[5]) : null;
      if (lastY !== null && y !== null && Math.abs(y - lastY) > 2) { lines.push(line); line = ""; }
      line += it.str; lastY = y;
      if (it.hasEOL) { lines.push(line); line = ""; lastY = null; }
    }
    if (line) lines.push(line);
    out.push(lines.join("\n"));
  }
  return out.join("\n\n");
}

/* ---------- 繪製 ---------- */
function render() {
  if (S.active !== "reset") S.prev = S.active;
  if (!VIEWS[S.active] || (S.active !== "reset" && st(S.active) === "locked")) S.active = "input";
  renderNav();
  const card = $("#stage");
  card.replaceChildren(...VIEWS[S.active]().filter(Boolean));
}
const mq = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
const reTheme = () => { mmdReady = false; if (!runningId) render(); };
mq && mq.addEventListener && mq.addEventListener("change", reTheme);
new MutationObserver(reTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
render();
})();
</script>
